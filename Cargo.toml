[package]
name = "srtty"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Turn video and audio into subtitles with OpenAI-compatible transcription APIs"

[features]
# Local whisper backend, added in plan 4.
local = []

[dependencies]
clap = { version = "4.6", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
etcetera = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
serde_json = "1.0.154"
async-trait = "0.1.92"

[dev-dependencies]
tempfile = "3"
