[package]
name = "srtty"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Turn video and audio into subtitles with OpenAI-compatible transcription APIs"

[features]
# Local whisper.cpp backend (needs CMake, a C/C++ compiler and libclang to build).
local = ["dep:whisper-rs"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "process", "fs", "io-util", "time", "signal"] }
etcetera = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
async-trait = "0.1.92"
reqwest = { version = "0.13", default-features = false, features = ["multipart", "json", "rustls"] }
base64 = "0.23.1"
sha2 = "0.11"
tokio-util = "0.7.20"
futures = "0.3"
tempfile = "3"
toml_edit = "0.25.17"
inquire = "0.9.4"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
whisper-rs = { version = "0.16.0", optional = true }

# Metal acceleration on macOS builds with the `local` feature.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", optional = true, features = ["metal"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
wiremock = "0.6"
